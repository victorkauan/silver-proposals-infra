name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in bootstrap environments/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # tflint --init downloads the AWS ruleset from the GitHub API; anonymous calls from shared runners
      # hit the rate limit, so authenticate with the job token.
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          tflint --recursive --config="$PWD/.tflint.hcl"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      # Every Checkov finding fails the job; accepted risks are skipped next to the resource with a reason.
      - name: Checkov
        run: |
          uvx --from checkov==3.4.3 checkov --directory . --framework terraform --compact --quiet \
            --output cli --output junitxml --output-file-path console,checkov.xml

      # Trivy fails on HIGH and CRITICAL misconfigurations.
      - name: Trivy (IaC misconfiguration)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .terraform \
            --misconfig-scanners terraform .

      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose /repo

      - name: Checkov report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-report
          path: checkov.xml
          retention-days: 30

  plan:
    if: github.event_name == 'pull_request'
    needs: [quality, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: [shared, staging, prod]
    concurrency:
      group: terraform-plan-${{ matrix.root }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
      TF_VAR_initialize_app_secret: ${{ vars.INITIALIZE_APP_SECRET || 'false' }}
      TF_VAR_enforce_waf: ${{ vars.ENFORCE_WAF || 'false' }}
      TF_VAR_enable_access_logs: ${{ vars.ENABLE_ALB_ACCESS_LOGS || 'false' }}
    defaults:
      run:
        working-directory: environments/${{ matrix.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      # Pull requests get the read-only plan role; it cannot change any resource.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN_PREFIX }}-${{ matrix.root }}-plan
          role-session-name: plan-${{ matrix.root }}-${{ github.run_id }}
          aws-region: us-east-1

      - run: terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan | tee plan.txt
          echo "summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | head -1)" >> "$GITHUB_OUTPUT"

      - name: Plan summary
        if: always()
        env:
          ROOT: ${{ matrix.root }}
        run: |
          {
            echo "### terraform plan: \`$ROOT\`"
            echo
            echo '```'
            grep -E '^(  # |Plan:|No changes\.)' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ matrix.root }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- terraform-plan:$ROOT -->"
          body="$marker
          **terraform plan \`$ROOT\`:** $SUMMARY ([run]($RUN_URL))"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
