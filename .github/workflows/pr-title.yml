name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            style
            revert
          subjectPattern: ^[a-z0-9].*[^.] \[SIL-\d+\]$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter or digit, must not end with a
            period, and must end with the Linear issue ID, for example "add login [SIL-205]".
