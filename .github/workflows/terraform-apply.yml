name: Terraform apply

on:
  workflow_call:
    inputs:
      root:
        description: Root module under environments/ (shared, staging, or prod).
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: apply (${{ inputs.root }})
    runs-on: ubuntu-24.04
    # The GitHub environment holds the approval rule (shared and prod need a reviewer) and is the
    # only OIDC subject the apply role trusts.
    environment: ${{ inputs.root }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-${{ inputs.root }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
    defaults:
      run:
        working-directory: environments/${{ inputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN_PREFIX }}-${{ inputs.root }}
          role-session-name: apply-${{ inputs.root }}-${{ github.run_id }}
          aws-region: us-east-1

      - run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan | tee plan.txt

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=120s tfplan | tee apply.txt

      - name: Summary
        if: always()
        env:
          ROOT: ${{ inputs.root }}
        run: |
          {
            echo "### terraform apply: \`$ROOT\`"
            echo '```'
            grep -hE '^(Plan:|No changes\.|Apply complete!|Error:)' plan.txt apply.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
