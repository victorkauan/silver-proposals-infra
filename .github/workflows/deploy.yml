name: Deploy

# After a merge to main: shared is applied only when it has changes and after approval, staging is
# applied automatically, and production waits for approval in its GitHub environment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  check-shared:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      TF_VAR_budget_alert_emails: ${{ secrets.BUDGET_ALERT_EMAILS }}
    defaults:
      run:
        working-directory: environments/shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN_PREFIX }}-shared-plan
          role-session-name: check-shared-${{ github.run_id }}
          aws-region: us-east-1

      - run: terraform init -input=false

      - name: Detect changes
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt
          code=$?
          set -e
          cat plan.txt
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

  apply-shared:
    needs: check-shared
    if: needs.check-shared.outputs.changes == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      root: shared
    secrets: inherit

  apply-staging:
    needs: [check-shared, apply-shared]
    if: always() && needs.check-shared.result == 'success' && (needs.apply-shared.result == 'success' || needs.apply-shared.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      root: staging
    secrets: inherit

  # Explicit condition: without it, a skipped apply-shared (no shared changes) would skip production too.
  apply-prod:
    needs: apply-staging
    if: always() && needs.apply-staging.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-apply.yml
    with:
      root: prod
    secrets: inherit
