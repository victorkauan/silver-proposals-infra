name: Release

# Semantic versioning from Conventional Commits: every merge to main with a feat or fix commit
# publishes a tag (vX.Y.Z) and a GitHub Release with generated notes.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes semantic-release@25.0.9
