<style>
/* Palco fixo de 1920×1080, escalado para a janela. Cada slide: rótulo do ato, uma manchete e uma
   figura. Serifa = linguagem humana; sans = dados; mono = notação e nomes técnicos. */
:root {
  color-scheme: dark;
  --bg: #0b1020;
  --bg-glow: #161f3b;
  --surface: #111a33;
  --surface-2: #172242;
  --raise: #1d2a52;
  --line: rgba(170, 186, 228, 0.16);
  --line-2: rgba(170, 186, 228, 0.38);
  --grid: rgba(170, 186, 228, 0.09);
  --ink: #eef1f8;
  --ink-2: #b7c0d9;
  --ink-3: #7f8aab;
  /* categorias: sempre acompanhadas de rótulo */
  --app: #4a8ef0;
  --app-ink: #93bbf7;
  --cloud: #f0a23a;
  --cloud-ink: #f6c27c;
  --data: #22a891;
  --data-ink: #6fd3c1;
  --sec: #b07ce8;
  --sec-ink: #ceaaf3;
  /* estado: sempre com ícone e rótulo */
  --good: #3cbc63;
  --bad: #e8574f;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6fb;
  --bg-glow: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef2f9;
  --raise: #ffffff;
  --line: rgba(20, 36, 88, 0.14);
  --line-2: rgba(20, 36, 88, 0.34);
  --grid: rgba(20, 36, 88, 0.09);
  --ink: #101a3a;
  --ink-2: #3b4870;
  --ink-3: #6b779c;
  --app: #2a72d9;
  --app-ink: #1c5bb4;
  --cloud: #d9851a;
  --cloud-ink: #9a5a08;
  --data: #0f9a84;
  --data-ink: #0a7464;
  --sec: #8a52cc;
  --sec-ink: #6c38ad;
  --good: #1f9a47;
  --bad: #cf3b35;
  --shadow: 0 18px 50px rgba(20, 36, 88, 0.13);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-sans);
  overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body.nocursor, body.nocursor * { cursor: none !important; }

#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; user-select: none;
  background: radial-gradient(1200px 760px at 18% 2%, var(--bg-glow), transparent 72%), var(--bg);
}
#stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, var(--grid) 1.3px, transparent 1.8px);
  background-size: 40px 40px; background-position: 20px 20px;
}

/* ── slides ─────────────────────────────────────────────────────────────── */
.slide {
  position: absolute; inset: 0; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.34s ease, visibility 0s linear 0.34s;
}

/* kit.js — utilidades de desenho e animação, sem dependências.
   Toda animação é uma função pura do progresso p ∈ [0, 1]: o motor pode tocar, concluir ou

    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3"/>',
    nokey: '<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l3 3M3 3l18 18"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    bell: '<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/>',

          p = K.clamp(p);
          const s = 0.86 + 0.14 * K.ease.back(p);
          g.setAttribute('transform', `translate(${o.cx},${o.cy}) scale(${s}) translate(${-o.cx},${-o.cy})`);
          g.style.opacity = K.clamp(p * 2);
        },
      };
      o.show(1);
      return (api.n[id] = o);
    };
    api.edge = (id, pts, o = {}) => {
      const g = K.s('g', {}, gE);
      const path = K.s('path', { d: K.route(pts, o.r || 16), class: 'edge' }, g);
      const head = K.s('path', { d: 'M1,0 L-12,-6 L-12,6 Z', class: 'head' }, g);
      const lab = o.label ? K.s('text', { x: o.lx, y: o.ly, class: 'edge-l', text: o.label }, g) : null;
      const len = path.getTotalLength();
      const a = path.getPointAtLength(len), b = path.getPointAtLength(Math.max(0, len - 3));
      head.setAttribute('transform', `translate(${a.x},${a.y}) rotate(${(Math.atan2(a.y - b.y, a.x - b.x) * 180) / Math.PI})`);
      path.style.strokeDasharray = `${len} ${len}`;
      const e = {
        g, path, len,
        show(p) {
          p = K.clamp(p);
          path.style.strokeDashoffset = len * (1 - K.ease.io(p));
          head.style.opacity = K.seg(p, 0.85, 1);
          g.style.opacity = p > 0 ? 1 : 0;
          if (lab) lab.style.opacity = K.seg(p, 0.4, 0.8);
        },
        at: (t) => path.getPointAtLength(len * K.clamp(t)),
      };
      e.show(1);
      return (api.e[id] = e);
    };
    api.token = (cls = '') => {
      const c = K.s('circle', { r: 11, class: 'tok ' + cls }, gT);
      c.style.opacity = 0;
      return { el: c, to(pt, op = 1) { c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.style.opacity = op; }, hide() { c.style.opacity = 0; } };
    };
    return api;
  };

  // Passa um token por uma sequência de arestas, cada uma ocupando a mesma fração de p.
  K.travel = (tok, edges, p) => {
    if (p <= 0 || p >= 1) return tok.hide();
    const n = edges.length, i = Math.min(n - 1, Math.floor(p * n));
    tok.to(edges[i].at(K.ease.io(p * n - i)));
  };

  // Número que conta de 0 até o valor final com o progresso.
  K.count = (el, value, p, d = 0, suffix = '') => {
    el.textContent = K.fmt(value * K.ease.out(K.clamp(p)), d) + suffix;
  };
})();
</script>

      </div>`,
    note: 'Dados de 19/11/2026, do GitHub e das execuções de CI. Produção em app.silversoft.com.br; staging em app-staging.silversoft.com.br.',
    setup(c) {
      const vs = c.$$('.n .v'), b = c.$('.cb-b'), vb = c.$('.v-b'), a = c.$('.cb-a');

  /* 9. avaliação com propostas reais e custo por proposta */
  const EVAL = [
    { v: 3.4, d: 1, suf: ' s', lbl: 'para o rascunho completo', sub: 'mediana de 30 gerações em staging' },
    { v: 290, d: 0, suf: '/291', lbl: 'fatos do briefing reproduzidos', sub: '10 propostas reais, 3 gerações cada' },
    { v: 0.07, d: 2, pre: 'R$ ', lbl: 'de IA por proposta, no máximo', sub: 'Nova 2 Lite, até 4.096 tokens de saída' },
  ];
  const ADDITIONS = { before: 57, after: 10 };
  S.push({
    id: 'avaliacao', act: 'Resultados', name: 'Avaliação com propostas reais',
    title: 'Com dez propostas reais, o rascunho sai em <em>segundos</em> e a IA custa centavos',
    html: `
      <div class="body">
        <div class="nums ev">${EVAL.map((n, i) => `
          <div class="n rv" data-at="0" style="--d:${i * 0.12}s"><div class="num">${n.pre ? `<small>${n.pre}</small>` : ''}<span class="v">0</span>${n.suf ? `<small>${n.suf}</small>` : ''}</div><p class="lbl">${n.lbl}</p><p class="src">${n.sub}</p></div>`).join('')}
        </div>
        <div class="cost rv" data-at="1">
          <div class="cost-hd">custo de uma proposta · 27 h de referência a R$ 50,68/h · −40% de tempo com IA</div>
          <div class="cb"><span class="cb-l">escrita à mão</span><div class="cb-t"><i class="cb-a"></i></div><span class="cb-v mono">R$ 1.368</span></div>
          <div class="cb"><span class="cb-l">com o Silver Proposals</span><div class="cb-t"><i class="cb-b"></i></div><span class="cb-v mono v-b">R$ 1.368</span></div>
        </div>
        <div class="finding rv" data-at="2">${K.icon('eye')}<span><b>A avaliação achou o que os testes não pegam:</b> sem regras explícitas, o modelo completava lacunas com condições comerciais plausíveis em ${ADDITIONS.before}% das saídas. Corrigido o prompt pela esteira e medido de novo: <b>${ADDITIONS.after}%</b>.</span></div>
      </div>`,
    note: 'Salário: Robert Half, Guia Salarial 2027 (executivo de contas, P/M). Horas: Loopio (2026), 27 h por RFP em PMEs. Redução: Noy e Zhang (2023). Preços: AWS Price List; PTAX de 19/11/2026.',
    setup(c) {
      const vs = c.$$('.n .v'), b = c.$('.cb-b'), vb = c.$('.v-b'), a = c.$('.cb-a');
      a.style.width = '100%';
      return [
        { dur: 1500, draw(p) { vs.forEach((el, i) => K.count(el, EVAL[i].v, K.seg(p, i * 0.08, 0.7 + i * 0.08), EVAL[i].d)); } },
        {
          dur: 1800,
          draw(p) {
            const t = K.ease.io(K.seg(p, 0.25, 1));
            b.style.width = K.lerp(100, (821 / 1368) * 100, t) + '%';
            vb.textContent = 'R$ ' + K.fmt(Math.round(K.lerp(1368, 821, t)), 0);
          },
        },
        { dur: 600, draw() {} },
      ];
    },
  });
})();

<script>
/* slides-d.js — próximos passos e encerramento (slide 10). */
(function () {
  'use strict';
  const K = window.K, S = window.SLIDES;

  const NEXT = [
    ['Chat sobre a proposta', 'perguntas e ajustes em linguagem natural'],
    ['Slides gerados', 'a proposta vira apresentação para o cliente'],
    ['Convites com papéis', 'editores e leitores por proposta'],

  S.push({
    id: 'fim', act: 'Próximos passos', name: 'Próximos passos e encerramento',
    title: 'Próximos passos, sobre a mesma base: <em>código, esteira e observabilidade</em>',
    html: `
      <div class="body">
        <ol class="next">${NEXT.map(([t, s], i) => `<li class="rv" data-at="0" style="--d:${i * 0.12}s"><b>${t}</b><span>${s}</span></li>`).join('')}</ol>
        <div class="thanks rv" data-at="1">
          <p class="serif">Obrigado.</p>
          <div class="links mono"><span>app.silversoft.com.br</span><span>github.com/victorkauan/silver-proposals-backend</span>
          <span>github.com/victorkauan/silver-proposals-frontend</span><span>github.com/victorkauan/silver-proposals-infra</span></div>
        </div>
      </div>`,
    setup() { return [{ dur: 0, draw() {} }, { dur: 0, draw() {} }]; },

<script>
/* engine.js — palco, navegação e passos.
   Cada slide tem passos { dur, draw(p, ctx) } com p ∈ [0, 1]. O passo 0 toca ao entrar;
   avançar conclui o passo atual e toca o seguinte; voltar desfaz. Elementos com data-at="k"
   recebem .on do passo k em diante. Modos: ?print (todos os slides no estado final, para PDF),
   ?instant (sem animação) e ?instant&at=0.5 (desenha o passo atual em 50%, para depuração). */
(function () {
  'use strict';
  const K = window.K, defs = window.SLIDES;
  const Q = new URLSearchParams(location.search);
  const PRINT = Q.has('print');
  const INSTANT = PRINT || Q.has('instant');
  const AT = Q.has('at') ? +Q.get('at') : 1;
  if (INSTANT) document.documentElement.classList.add('instant');
  const stage = document.getElementById('stage');
  const $ = (id) => document.getElementById(id);
  const st = { i: -1, k: 0, anim: null, typed: '' };
  const acts = [];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } },
  };
  const theme = Q.get('theme') || store.get('silver-deck-theme');
  if (theme === 'light') document.documentElement.dataset.theme = 'light';

  function fit() {
    if (PRINT) return void (window.DECK_SCALE = 1);
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    window.DECK_SCALE = s;
    stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  }

  function build() {
    defs.forEach((d, i) => {
      const el = document.createElement('section');
      el.className = 'slide s-' + d.id;
      el.innerHTML =
        (d.bare ? '' : `<header class="hd"><h1 class="h1">${d.title}</h1></header>`) +
        (d.html || '') + (d.note ? `<footer class="note">${d.note}</footer>` : '') +
        `<div class="pn">${String(i + 1).padStart(2, '0')} / ${defs.length}</div>`;
      stage.appendChild(el);
      d.el = el;
      d.ctx = { el, $: (q) => el.querySelector(q), $$: (q) => [...el.querySelectorAll(q)] };
      d.steps = [];
    });
    defs.forEach((d) => {
      d.el.classList.add('active');
      const r = d.setup ? d.setup(d.ctx) : null;
      d.el.classList.remove('active');
      if (Array.isArray(r)) d.steps = r;
      let n = d.steps.length;
      d.el.querySelectorAll('[data-at]').forEach((e) => { n = Math.max(n, +e.dataset.at + 1); });
      d.n = Math.max(1, n);
    });
  }

  const draw = (d, j, p) => { const s = d.steps[j]; if (s && s.draw) s.draw(p, d.ctx); };
  function reveal(d, k) {
    d.el.querySelectorAll('[data-at]').forEach((e) => e.classList.toggle('on', +e.dataset.at <= k));
    d.el.dataset.step = k;
  }
  function apply(d, k, p) {
    for (let j = d.n - 1; j > k; j--) draw(d, j, 0);
    for (let j = 0; j < k; j++) draw(d, j, 1);
    draw(d, k, p);
    reveal(d, k);
  }
  function quiet(d, fn) {
    d.el.classList.add('instant');
    fn();
    void d.el.offsetWidth;
    if (!PRINT) d.el.classList.remove('instant');
  }
  function stop() { if (st.anim) { draw(st.anim.d, st.anim.k, 1); st.anim = null; } }
  function play() {
    const d = defs[st.i], s = d.steps[st.k];
    if (!s || !s.draw) return;
    if (!s.dur || INSTANT) return void s.draw(1, d.ctx);
    st.anim = { d, k: st.k, t0: performance.now(), dur: s.dur };
  }
  // 'fwd' entra animando o passo 0; 'back' entra no estado final; 'jump' vai direto a um passo.
  function enter(i, k, mode) {
    i = K.clamp(i, 0, defs.length - 1);
    stop();
    const d = defs[i], old = defs[st.i];
    if (old && old !== d) old.el.classList.remove('active');
    st.i = i;
    if (mode === 'fwd') {
      st.k = 0;
      quiet(d, () => { apply(d, 0, 0); d.el.querySelectorAll('[data-at]').forEach((e) => e.classList.remove('on')); });
      d.el.classList.add('active');
      reveal(d, 0);
      play();
    } else {
      st.k = mode === 'back' ? d.n - 1 : K.clamp(k || 0, 0, d.n - 1);
      quiet(d, () => apply(d, st.k, 1));
      d.el.classList.add('active');
    }
    sync();
  }
  function next() {
    const d = defs[st.i];
    stop();
    if (st.k < d.n - 1) { st.k++; reveal(d, st.k); play(); sync(); }
    else if (st.i < defs.length - 1) enter(st.i + 1, 0, 'fwd');
  }
  function prev() {
    const d = defs[st.i];
    stop();
    if (st.k > 0) { st.k--; apply(d, st.k, 1); sync(); }
    else if (st.i > 0) enter(st.i - 1, 0, 'back');
  }
  function sync() {
    const d = defs[st.i];
    acts.forEach((a) => {
      a.el.classList.toggle('cur', a.name === d.act);
      const done = st.i > a.to ? 1 : st.i < a.from ? 0 : (st.i - a.from + (st.k + 1) / d.n) / (a.to - a.from + 1);
      a.fill.style.width = done * 100 + '%';
    });
    $('rail').style.opacity = d.bare ? 0 : 1;
    $('pgn').textContent = String(st.i + 1).padStart(2, '0') + ' / ' + defs.length;
    $('pgd').innerHTML = d.n > 1 ? Array.from({ length: d.n }, (_, j) => `<i class="${j <= st.k ? 'done' : ''}"></i>`).join('') : '';
    $('pg').style.opacity = d.bare ? 0 : 1;
    if (!PRINT) history.replaceState(null, '', location.search + '#' + (st.i + 1) + (st.k ? '.' + st.k : ''));
    document.querySelectorAll('#idx button').forEach((b, j) => b.classList.toggle('cur', j === st.i));
  }
  function frame(now) {
    if (st.anim) {
      const a = st.anim, p = Math.min(1, (now - a.t0) / a.dur);
      draw(a.d, a.k, p);
      if (p >= 1) st.anim = null;
    }
    requestAnimationFrame(frame);
  }

  function chrome() {
    stage.insertAdjacentHTML('beforeend', `
      <nav id="rail"></nav>
      <div id="pg"><span class="dots" id="pgd"></span><span id="pgn"></span></div>
      <div id="toast"></div><div id="black"></div>
      <div class="over" id="idx"><h2>Índice · clique para ir · G fecha</h2><div class="grid"></div></div>
      <div class="over" id="help"><h2>Atalhos</h2><dl>
        <dt>→ espaço PageDown clique</dt><dd>avança um passo</dd>
        <dt>← PageUp</dt><dd>volta um passo</dd>
        <dt>↓ ↑</dt><dd>próximo slide, slide anterior</dd>
        <dt>número + Enter</dt><dd>vai para o slide</dd>
        <dt>G</dt><dd>índice dos slides</dd>
        <dt>R</dt><dd>repete a animação do slide</dd>
        <dt>F</dt><dd>tela cheia</dd>
        <dt>T</dt><dd>tema claro ou escuro</dd>
        <dt>B</dt><dd>tela preta</dd>
        <dt>?</dt><dd>esta ajuda</dd></dl></div>`);
    const rail = $('rail');
    defs.forEach((d, i) => {
      if (!d.act) return;
      let a = acts[acts.length - 1];
      if (!a || a.name !== d.act) {
        const el = K.h(`<span>${d.act}<i><b></b></i></span>`);
        rail.appendChild(el);
        acts.push((a = { name: d.act, from: i, to: i, el, fill: el.querySelector('b') }));
      }
      a.to = i;
    });
    const grid = stage.querySelector('#idx .grid');
    defs.forEach((d, i) => {
      const b = K.h(`<button><small>${String(i + 1).padStart(2, '0')}${d.act ? ' · ' + d.act : ''}</small><span>${d.name}</span></button>`);
      b.addEventListener('click', (e) => { e.stopPropagation(); toggle('idx', false); enter(i, 0, 'fwd'); });
      grid.appendChild(b);
    });
  }
  const toggle = (id, on) => $(id).classList.toggle('open', on);
  const anyOpen = () => document.querySelector('.over.open');
  let toastT;
  function toast(s) {
    const t = $('toast');
    t.textContent = s;
    t.style.opacity = 1;
    clearTimeout(toastT);
    toastT = setTimeout(() => (t.style.opacity = 0), 1100);
  }

  function keys(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if ($('black').style.display === 'block') { $('black').style.display = 'none'; return e.preventDefault(); }
    if (k === 'Escape') { document.querySelectorAll('.over.open').forEach((o) => o.classList.remove('open')); st.typed = ''; return; }
    if (/^\d$/.test(k)) { st.typed += k; return toast('ir para ' + st.typed + ' ⏎'); }
    if (k === 'Enter' && st.typed) { const n = +st.typed; st.typed = ''; toggle('idx', false); return enter(n - 1, 0, 'fwd'); }
    st.typed = '';
    const act = {
      ArrowRight: next, PageDown: next, ' ': next, Enter: next,
      ArrowLeft: prev, PageUp: prev, Backspace: prev,
      ArrowDown: () => enter(st.i + 1, 0, 'fwd'), ArrowUp: () => enter(st.i - 1, 0, 'back'),
      Home: () => enter(0, 0, 'fwd'), End: () => enter(defs.length - 1, 0, 'fwd'),
      r: () => enter(st.i, 0, 'fwd'),
      g: () => { toggle('help', false); $('idx').classList.toggle('open'); },
      '?': () => { toggle('idx', false); $('help').classList.toggle('open'); },
      f: () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {})),
      t: () => {
        const light = document.documentElement.dataset.theme !== 'light';
        light ? (document.documentElement.dataset.theme = 'light') : delete document.documentElement.dataset.theme;
        store.set('silver-deck-theme', light ? 'light' : 'dark');
      },
      b: () => ($('black').style.display = 'block'),
    }[k.length === 1 ? k.toLowerCase() : k];
    if (act) { e.preventDefault(); act(); }
  }

  function pointer() {
    stage.addEventListener('click', (e) => {
      if (anyOpen()) return void (e.target.closest('.over') === e.target && e.target.classList.remove('open'));
      if ($('black').style.display === 'block') return void ($('black').style.display = 'none');
      e.shiftKey ? prev() : next();
    });
    stage.addEventListener('contextmenu', (e) => { e.preventDefault(); if (!anyOpen()) prev(); });
    let idle;
    addEventListener('mousemove', () => {
      document.body.classList.remove('nocursor');
      clearTimeout(idle);
      idle = setTimeout(() => document.body.classList.add('nocursor'), 2400);
    });
    let tx = null;
    addEventListener('touchstart', (e) => (tx = e.touches[0].clientX), { passive: true });
    addEventListener('touchend', (e) => {
      if (tx == null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
      tx = null;
    });
  }

  function start() {
    build();
    chrome();
    fit();
    if (PRINT) {
      document.body.classList.add('print');
      defs.forEach((d) => { d.el.classList.add('active', 'instant'); apply(d, d.n - 1, 1); });
      return;
    }
    addEventListener('resize', fit);
    addEventListener('keydown', keys);
    pointer();
    const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash);
    m ? enter(+m[1] - 1, +(m[2] || 0), m[2] || INSTANT ? 'jump' : 'fwd') : enter(0, 0, 'fwd');
    if (INSTANT) apply(defs[st.i], st.k, AT);
    requestAnimationFrame(frame);
  }
  // As medidas do SVG dependem das fontes embutidas: carrega antes de montar.
  const faces = ['500 60px Newsreader', 'italic 500 60px Newsreader', '600 20px "Libre Franklin"', '800 20px "Libre Franklin"', '500 20px "JetBrains Mono"'];
  const ready = document.fonts && document.fonts.load ? Promise.all(faces.map((f) => document.fonts.load(f))) : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 2500))]).then(start, start);
})();
</script>
