default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: conventional-commit-message
        name: "commit message: <type>(<scope>): <lowercase subject>, max 72 chars, no period"
        language: pygrep
        entry: '\A(?=[^\n]{1,72}(\n|\Z))(feat|fix|docs|refactor|perf|test|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: [a-z0-9][^\n]*(?<!\.)(\n|\Z)'
        args: [--multiline, --negate]
        stages: [commit-msg]
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt -recursive
        language: system
        files: \.tf$
        pass_filenames: false
      - id: terraform-validate
        name: terraform validate
        entry: bash -c 'for dir in environments/*/; do terraform -chdir="$dir" init -backend=false -input=false >/dev/null && terraform -chdir="$dir" validate -no-color || exit 1; done'
        language: system
        files: \.(tf|hcl)$
        pass_filenames: false
      - id: tflint
        name: tflint
        entry: bash -c 'tflint --init --config="$PWD/.tflint.hcl" >/dev/null && tflint --recursive --config="$PWD/.tflint.hcl"'
        language: system
        files: \.(tf|hcl)$
        pass_filenames: false
